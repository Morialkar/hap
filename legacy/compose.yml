name: eusebe-v2

# Eusèbe v2 time capsule.
#   docker compose up --build   →  http://localhost:8056
# The v2 repo is mounted READ-ONLY; DB config is overridden by a mounted file;
# storage/ is a writable named volume. The private dump seeds MySQL on first boot
# (EUSEBE_DUMP_PATH, default ~/Archives/eusebe/eusebe.sql — never in any repo).

services:
  db:
    image: mysql:5.7
    platform: linux/amd64 # no arm64 build exists; Rosetta on Apple Silicon
    # Era-appropriate SQL behavior: MySQL 5.5 (2013) had an empty sql_mode;
    # 5.7's ONLY_FULL_GROUP_BY breaks the /annex GROUP BY query.
    command: --sql-mode=
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eusebe
      MYSQL_USER: eusebe
      MYSQL_PASSWORD: Smj4UheAFUASB7nU # matches the config committed in v2 (throwaway, container-local)
    volumes:
      - ${EUSEBE_DUMP_PATH:-${HOME}/Archives/eusebe/eusebe.sql}:/docker-entrypoint-initdb.d/eusebe.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    platform: linux/amd64 # php:5.6 images are amd64-only
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8056:80"
    volumes:
      - ${EUSEBE_SRC:-../../Eusebe}:/var/www/html:ro
      - storage:/var/www/html/storage
      - ./overrides/database.php:/var/www/html/application/config/database.php:ro
      - ./overrides/routes.php:/var/www/html/application/routes.php:ro
      - img:/var/www/html/public/img
      - ./php/eusebe.ini:/etc/php5/conf.d/99-eusebe.ini:ro
    command: >
      bash -c "mkdir -p /var/www/html/storage/cache /var/www/html/storage/database
      /var/www/html/storage/logs /var/www/html/storage/sessions
      /var/www/html/storage/views /var/www/html/storage/work
      && chmod -R 777 /var/www/html/storage
      && chmod 777 /var/www/html/public/img
      && . /etc/apache2/envvars && exec apache2 -D FOREGROUND"

volumes:
  storage:
  img:
