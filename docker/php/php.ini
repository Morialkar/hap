date.timezone = America/Montreal
display_errors = Off
error_reporting = E_ALL
upload_max_filesize = 64M
post_max_size = 70M
; Report exports render every matching record in one pass. Measured peak for the
; heaviest real case (247 records through the card layout) is 288M, which the old
; 256M limit killed outright.
memory_limit = 512M
; Same render takes ~80s, so the request must outlive the default 30s.
max_execution_time = 180
opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
