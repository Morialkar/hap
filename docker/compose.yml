services:
  app:
    build:
      context: ./php
      dockerfile: Dockerfile
    volumes:
      - ../apps/api:/var/www/api
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hap

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ../apps/api:/var/www/api
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - hap

  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hap}
      POSTGRES_USER: ${DB_USERNAME:-hap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hap} -d ${DB_DATABASE:-hap}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hap

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - hap

networks:
  hap:
    driver: bridge

volumes:
  db_data:
