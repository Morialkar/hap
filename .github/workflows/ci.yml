name: CI

# See docs/CONVENTIONS.md for project conventions (naming, structure, testing, i18n)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_performance:
        description: 'Run performance benchmark'
        required: false
        default: false
        type: boolean

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql
          coverage: none

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Composer dependencies
        run: cd apps/api && composer install --no-interaction --prefer-dist

      - name: Laravel Pint
        run: cd apps/api && php vendor/bin/pint --test

      - name: Larastan
        run: cd apps/api && php vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: ESLint
        run: cd apps/client && pnpm exec eslint .

      - name: Prettier check
        run: cd apps/client && pnpm exec prettier --check .

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: hap
          POSTGRES_USER: hap
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: cd apps/api && composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: cd apps/api && cp .env.example .env

      - name: Generate app key
        run: cd apps/api && php artisan key:generate

      - name: Run migrations
        run: cd apps/api && php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: hap
          DB_USERNAME: hap
          DB_PASSWORD: secret

      - name: Run Pest
        run: cd apps/api && php vendor/bin/pest
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: hap
          DB_USERNAME: hap
          DB_PASSWORD: secret

      - name: Run Property-Based Tests
        run: cd apps/api && php vendor/bin/pest --group property-based
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: hap
          DB_USERNAME: hap
          DB_PASSWORD: secret

  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: cd apps/client && pnpm exec tsc --noEmit

      - name: Vitest
        run: cd apps/client && pnpm exec vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, api-tests, client-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: cd apps/client && pnpm exec vite build

  performance:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    if: github.event.inputs.run_performance == 'true'
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: hap
          POSTGRES_USER: hap
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: cd apps/api && composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: cd apps/api && cp .env.example .env

      - name: Generate app key
        run: cd apps/api && php artisan key:generate

      - name: Run migrations
        run: cd apps/api && php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: hap
          DB_USERNAME: hap
          DB_PASSWORD: secret

      - name: Run scale seeder (reduced for CI)
        run: cd apps/api && SCALE_RECORD_COUNT=1000 php artisan db:seed --class=ScaleFixtureSeeder
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: hap
          DB_USERNAME: hap
          DB_PASSWORD: secret

      - name: Run performance benchmark
        run: cd apps/api && php artisan app:benchmark-performance
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: hap
          DB_USERNAME: hap
          DB_PASSWORD: secret

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: apps/api/docs/PERFORMANCE.md
